<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحويل الصور إلى QR وعرضها عند المسح</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- مكتبة توليد QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <!-- مكتبة قراءة QR -->
    <script src="https://unpkg.com/@zxing/library@latest"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center p-4 font-sans">

    <!-- شريط التبديل العلوي -->
    <div class="w-full max-w-md bg-slate-800 p-2 rounded-2xl shadow-lg mb-6 flex gap-2 border border-slate-700">
        <button onclick="switchTab('generate')" id="tabGenerate" class="flex-1 py-3 rounded-xl font-bold text-sm transition bg-emerald-600 text-white shadow">
            🖼️ تحويل صورة إلى QR
        </button>
        <button onclick="switchTab('scan')" id="tabScan" class="flex-1 py-3 rounded-xl font-bold text-sm transition text-slate-300 hover:bg-slate-700">
            📷 قراءة QR وعرض الصورة
        </button>
    </div>

    <!-- ==================== 1. قسم رفع الصورة وتحويلها إلى QR ==================== -->
    <div id="generatorSection" class="w-full max-w-md bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 flex flex-col items-center">
        
        <label class="w-full bg-gradient-to-l from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 text-white py-4 px-4 rounded-xl font-bold cursor-pointer transition shadow-lg flex flex-col items-center justify-center gap-1.5 mb-4 border border-purple-400/30 text-center">
            <span class="text-lg">📤 اختر صورة لتحويلها إلى رمز QR</span>
            <span class="text-xs text-purple-200 font-normal">عند مسح الرمز الناتج ستظهر هذه الصورة مباشرة</span>
            <input type="file" id="imageUploadInput" accept="image/*" class="hidden" onchange="handleImageToQR(event)">
        </label>

        <!-- معاينة الصورة التي تم رفعها -->
        <div id="imagePreviewContainer" class="hidden w-full mb-4 bg-slate-900/70 p-3 rounded-xl border border-slate-700 flex items-center gap-3">
            <img id="uploadedImagePreview" src="" alt="معاينة" class="w-16 h-16 object-cover rounded-lg border border-slate-600">
            <div class="flex-1 overflow-hidden">
                <p class="text-xs text-emerald-400 font-bold mb-1">الصورة المدمجة في الرمز:</p>
                <a id="uploadedImageUrl" href="#" target="_blank" class="text-xs text-blue-400 underline truncate block dir-ltr text-left"></a>
            </div>
        </div>

        <div class="w-full flex items-center gap-2 my-1">
            <hr class="flex-1 border-slate-700">
            <span class="text-xs text-slate-400">أو اكتب نصاً / رابط صورة</span>
            <hr class="flex-1 border-slate-700">
        </div>

        <input type="text" id="textInput" placeholder="أدخل نصاً أو رابطاً هنا..." oninput="generateQRFromText(this.value)" class="w-full p-3 bg-slate-900 border border-slate-600 rounded-xl text-white mt-2 mb-3 focus:outline-none focus:border-emerald-400 text-right">

        <p id="statusText" class="text-amber-400 text-sm mb-3 font-bold text-center min-h-[20px]"></p>

        <!-- لوحة عرض رمز QR -->
        <div class="bg-white p-4 rounded-2xl shadow-inner mb-4 flex items-center justify-center">
            <canvas id="qrCanvas" class="w-[220px] h-[220px]"></canvas>
        </div>

        <button onclick="downloadQR()" class="w-full bg-emerald-600 hover:bg-emerald-700 py-3.5 rounded-xl font-bold transition shadow-md flex items-center justify-center gap-2">
            <span>💾 حفظ رمز QR كصورة</span>
        </button>
    </div>

    <!-- ==================== 2. قسم قراءة QR وعرض الصورة فوراً ==================== -->
    <div id="scanSection" class="w-full max-w-md bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 flex flex-col items-center hidden">
        
        <!-- شاشة الكاميرا -->
        <div id="cameraWrapper" class="relative w-full h-64 bg-black rounded-xl overflow-hidden mb-4 flex items-center justify-center border-2 border-emerald-500">
            <video id="video" class="w-full h-full object-cover"></video>
            <div class="absolute inset-0 border-2 border-dashed border-emerald-400 opacity-50 pointer-events-none m-8 rounded-lg"></div>
        </div>

        <!-- زر رفع صورة QR من الجهاز لقراءتها -->
        <label class="w-full bg-indigo-600 hover:bg-indigo-700 text-center py-3 rounded-xl font-bold cursor-pointer transition flex items-center justify-center gap-2 mb-4 shadow">
            <span>📁 اختر صورة رمز QR من جهازك لقراءتها</span>
            <input type="file" accept="image/*" class="hidden" onchange="scanQRFromFile(event)">
        </label>

        <!-- نافذة عرض الصورة المستخرجة من الـ QR -->
        <div id="scannedImageContainer" class="hidden w-full bg-slate-900 p-4 rounded-2xl border-2 border-emerald-500 mb-4 flex flex-col items-center shadow-lg">
            <p class="text-emerald-400 font-bold text-sm mb-3">🎉 تم العثور على صورة داخل رمز الـ QR:</p>
            <img id="scannedImageDisplay" src="" alt="الصورة المستخرجة" class="max-h-80 w-auto rounded-xl border border-slate-700 shadow-md mb-3 object-contain bg-black">
            <a id="downloadScannedImgBtn" href="#" target="_blank" class="w-full bg-emerald-600 hover:bg-emerald-700 text-center py-2.5 rounded-xl font-bold text-sm transition">
                🔍 عرض الصورة بالحجم الكامل / تحميل
            </a>
        </div>

        <!-- النص أو الرابط المستخرج -->
        <p id="scanResult" class="text-center text-slate-200 bg-slate-900 p-3.5 rounded-xl w-full mb-3 min-h-[52px] flex items-center justify-center break-all text-sm">
            وجه الكاميرا نحو الرمز أو ارفع صورة الرمز...
        </p>

        <a id="openUrlBtn" href="#" target="_blank" class="hidden w-full bg-blue-600 hover:bg-blue-700 text-center py-3 rounded-xl font-bold transition shadow">
            🌐 فتح الرابط
        </a>
    </div>

    <script>
        const IMGBB_API_KEY = "d6e15cb5b6c12b8e7157afee611aa441";
        let qr;
        let codeReader = new ZXing.BrowserQRCodeReader();
        let hasValidQR = false;

        window.onload = function() {
            qr = new QRious({
                element: document.getElementById('qrCanvas'),
                size: 512,
                value: '',
                level: 'H'
            });
            clearQRCanvas();
        };

        function clearQRCanvas() {
            const canvas = document.getElementById('qrCanvas');
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#94a3b8";
            ctx.font = "bold 28px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("سيظهر رمز QR هنا", canvas.width / 2, canvas.height / 2);
            hasValidQR = false;
        }

        function switchTab(tab) {
            const genSec = document.getElementById("generatorSection");
            const scanSec = document.getElementById("scanSection");
            const tabGen = document.getElementById("tabGenerate");
            const tabScan = document.getElementById("tabScan");

            if (tab === 'generate') {
                genSec.classList.remove("hidden");
                scanSec.classList.add("hidden");
                tabGen.className = "flex-1 py-3 rounded-xl font-bold text-sm transition bg-emerald-600 text-white shadow";
                tabScan.className = "flex-1 py-3 rounded-xl font-bold text-sm transition text-slate-300 hover:bg-slate-700";
                stopCamera();
            } else {
                genSec.classList.add("hidden");
                scanSec.classList.remove("hidden");
                tabScan.className = "flex-1 py-3 rounded-xl font-bold text-sm transition bg-emerald-600 text-white shadow";
                tabGen.className = "flex-1 py-3 rounded-xl font-bold text-sm transition text-slate-300 hover:bg-slate-700";
                startCamera();
            }
        }

        // توليد QR من النص أو الرابط
        function generateQRFromText(text) {
            const status = document.getElementById("statusText");
            if (!text || text.trim() === "") {
                clearQRCanvas();
                status.innerText = "";
                return;
            }
            qr.value = text.trim();
            hasValidQR = true;
            status.className = "text-emerald-400 text-sm mb-3 font-bold text-center";
            status.innerText = "✅ رمز الـ QR جاهز!";
        }

        // ضغط الصورة لتسريع الرفع
        function compressImage(file, maxSize = 800, quality = 0.75) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        let w = img.width;
                        let h = img.height;
                        if (w > maxSize || h > maxSize) {
                            if (w > h) { h = Math.round((h * maxSize) / w); w = maxSize; }
                            else { w = Math.round((w * maxSize) / h); h = maxSize; }
                        }
                        const canvas = document.createElement("canvas");
                        canvas.width = w;
                        canvas.height = h;
                        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL("image/jpeg", quality));
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // رفع الصورة وتحويلها إلى QR
        async function handleImageToQR(event) {
            const file = event.target.files[0];
            if (!file) return;

            const status = document.getElementById("statusText");
            const previewContainer = document.getElementById("imagePreviewContainer");
            const previewImg = document.getElementById("uploadedImagePreview");
            const previewUrl = document.getElementById("uploadedImageUrl");

            status.className = "text-amber-400 text-sm mb-3 font-bold text-center animate-pulse";
            status.innerText = "⏳ جاري رفع الصورة وتحويلها إلى رمز QR...";

            try {
                const compressedDataUrl = await compressImage(file, 800, 0.75);
                previewImg.src = compressedDataUrl;
                const base64String = compressedDataUrl.split(',')[1];

                const formData = new FormData();
                formData.append("key", IMGBB_API_KEY);
                formData.append("image", base64String);

                const response = await fetch("https://api.imgbb.com/1/upload", {
                    method: "POST",
                    body: formData
                });

                const result = await response.json();

                if (result && result.success && result.data && result.data.url) {
                    // استخدام الرابط المباشر للصورة (data.url) لكي تفتح كصورة مباشرة عند المسح
                    const directImageUrl = result.data.url;

                    document.getElementById("textInput").value = directImageUrl;
                    previewUrl.href = directImageUrl;
                    previewUrl.innerText = directImageUrl;
                    previewContainer.classList.remove("hidden");

                    generateQRFromText(directImageUrl);
                    status.className = "text-emerald-400 text-sm mb-3 font-bold text-center";
                    status.innerText = "✅ تم تحويل الصورة إلى QR بنجاح! جرب مسحه الآن.";
                } else {
                    throw new Error("Upload failed");
                }
            } catch (err) {
                console.error(err);
                status.className = "text-red-400 text-sm mb-3 font-bold text-center";
                status.innerText = "❌ تعذر رفع الصورة، تحقق من الاتصال بالإنترنت.";
            }
        }

        function downloadQR() {
            if (!hasValidQR) {
                alert("الرجاء رفع صورة أو إدخال نص أولاً!");
                return;
            }
            const canvas = document.getElementById('qrCanvas');
            const link = document.createElement('a');
            link.download = 'Image_QR_' + Date.now() + '.png';
            link.href = canvas.toDataURL("image/png");
            link.click();
        }

        // ==================== قراءة الـ QR وعرض الصورة فوراً ====================

        function startCamera() {
            codeReader.decodeFromVideoDevice(undefined, 'video', (result, err) => {
                if (result) {
                    showScanResult(result.text);
                }
            }).catch(err => console.error(err));
        }

        function stopCamera() {
            codeReader.reset();
        }

        function showScanResult(text) {
            const resElem = document.getElementById("scanResult");
            const urlBtn = document.getElementById("openUrlBtn");
            const imgContainer = document.getElementById("scannedImageContainer");
            const imgDisplay = document.getElementById("scannedImageDisplay");
            const downloadImgBtn = document.getElementById("downloadScannedImgBtn");

            resElem.innerText = text;
            imgContainer.classList.add("hidden");

            if (text.startsWith("http://") || text.startsWith("https://") || text.startsWith("data:image/")) {
                urlBtn.href = text;
                urlBtn.classList.remove("hidden");

                // فحص تلقائي: إذا كان الرابط عبارة عن صورة، يتم تحميلها وعرضها فوراً على الشاشة
                imgDisplay.onload = function() {
                    imgContainer.classList.remove("hidden");
                    downloadImgBtn.href = text;
                };
                imgDisplay.onerror = function() {
                    imgContainer.classList.add("hidden");
                };
                imgDisplay.src = text;
            } else {
                urlBtn.classList.add("hidden");
            }
        }

        function scanQRFromFile(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    codeReader.decodeFromImage(img).then(result => {
                        showScanResult(result.text);
                    }).catch(() => {
                        alert("❌ لم يتم العثور على رمز QR صالح في هذه الصورة!");
                    });
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
