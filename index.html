<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق قارئ ومولد QR</title>
    <!-- استدعاء Tailwind CSS للتصميم السريع والأنيق -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- مكتبة قراءة وتوليد QR للويب -->
    <script src="https://unpkg.com/@zxing/library@latest"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center p-4">

    <!-- العنوان وزر التبديل -->
    <div class="w-full max-w-md flex justify-between items-center mb-6 bg-gray-800 p-4 rounded-xl shadow-lg">
        <h1 class="text-xl font-bold text-green-400">قارئ ومولد QR</h1>
        <button onclick="toggleMode()" id="modeToggleBtn" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg text-sm font-semibold transition">
            الانتقال إلى التوليد
        </button>
    </div>

    <!-- قسم المسح (Scanner Section) -->
    <div id="scanSection" class="w-full max-w-md flex flex-col items-center bg-gray-800 p-6 rounded-2xl shadow-xl">
        <div class="relative w-full h-64 bg-black rounded-xl overflow-hidden mb-4 flex items-center justify-center border-2 border-green-500">
            <video id="video" class="w-full h-full object-cover"></video>
            <div class="absolute inset-0 border-4 border-dashed border-green-400 opacity-40 pointer-events-none m-8 rounded-lg"></div>
        </div>
        <p id="scanResult" class="text-center text-gray-300 bg-gray-700 p-3 rounded-lg w-full mb-3 min-h-[50px] flex items-center justify-center">قم بتوجيه الكاميرا نحو الرمز...</p>
        <a id="openUrlBtn" href="#" target="_blank" class="hidden w-full bg-blue-500 hover:bg-blue-600 text-center py-2 rounded-lg font-bold transition mb-2">فتح الرابط</a>
        
        <!-- زر اختيار صورة للمسح -->
        <label class="w-full bg-gray-700 hover:bg-gray-600 text-center py-2 rounded-lg font-semibold cursor-pointer transition">
            اختر صورة من الجهاز لفحصها
            <input type="file" accept="image/*" class="hidden" onchange="scanImageFromFile(event)">
        </label>
    </div>

    <!-- قسم التوليد (Generator Section - مخفياً افتراضياً) -->
    <div id="generatorSection" class="w-full max-w-md flex flex-col items-center bg-gray-800 p-6 rounded-2xl shadow-xl hidden">
        <input type="text" id="textInput" placeholder="أدخل النص أو الرابط هنا..." oninput="generateQR()" class="w-full p-3 bg-gray-700 border border-gray-600 rounded-xl text-white mb-4 focus:outline-none focus:border-green-400 text-right">
        
        <div class="bg-white p-4 rounded-xl shadow-inner mb-4 flex items-center justify-center min-h-[220px] min-w-[220px]">
            <div id="qrcode"></div>
        </div>

        <p id="statusText" class="text-green-400 text-sm mb-3 font-semibold"></p>
        
        <button onclick="downloadQR()" class="w-full bg-green-600 hover:bg-green-700 py-2 rounded-lg font-bold transition">
            حفظ رمز QR كصورة
        </button>
    </div>

    <!-- مكتبة لتوليد الـ QR بسهولة (QRCode.js) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
        let isScanMode = true;
        let codeReader = new ZXing.BrowserQRCodeReader();
        let selectedDeviceId;
        let qrInstance;

        // تهيئة مولد الـ QR
        window.onload = function() {
            qrInstance = new QRCode(document.getElementById("qrcode"), {
                text: "",
                width: 200,
                height: 200,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
            startCamera();
        };

        // تبديل الأوضاع بين المسح والتوليد
        function toggleMode() {
            isScanMode = !isScanMode;
            const scanSec = document.getElementById("scanSection");
            const genSec = document.getElementById("generatorSection");
            const btn = document.getElementById("modeToggleBtn");

            if (isScanMode) {
                scanSec.classList.remove("hidden");
                genSec.classList.add("hidden");
                btn.innerText = "الانتقال إلى التوليد";
                startCamera();
            } else {
                scanSec.classList.add("hidden");
                genSec.classList.remove("hidden");
                btn.innerText = "الانتقال إلى المسح";
                stopCamera();
            }
        }

        // تشغيل الكاميرا للمسح
        function startCamera() {
            codeReader.decodeFromVideoDevice(undefined, 'video', (result, err) => {
                if (result) {
                    let text = result.text;
                    let resElem = document.getElementById("scanResult");
                    let urlBtn = document.getElementById("openUrlBtn");
                    
                    resElem.innerText = text;
                    if (text.startsWith("http://") || text.startsWith("https://")) {
                        urlBtn.href = text;
                        urlBtn.classList.remove("hidden");
                    } else {
                        urlBtn.classList.add("hidden");
                    }
                }
            }).catch(err => console.error(err));
        }

        function stopCamera() {
            codeReader.reset();
        }

        // توليد الرمز لحظياً عند الكتابة
        function generateQR() {
            let val = document.getElementById("textInput").value;
            qrInstance.clear();
            if(val.trim() !== "") {
                qrInstance.makeCode(val);
                document.getElementById("statusText").innerText = "تم إنشاء الرمز بنجاح!";
            } else {
                document.getElementById("statusText").innerText = "";
            }
        }

        // مسح رمز QR من صورة مرفوعة
        function scanImageFromFile(e) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    codeReader.decodeFromImage(img).then(result => {
                        let text = result.text;
                        document.getElementById("scanResult").innerText = text;
                        let urlBtn = document.getElementById("openUrlBtn");
                        if (text.startsWith("http://") || text.startsWith("https://")) {
                            urlBtn.href = text;
                            urlBtn.classList.remove("hidden");
                        }
                    }).catch(err => alert("لم يتم العثور على رمز QR صالح في الصورة!"));
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        }

        // تحميل الرمز كصورة PNG
        function downloadQR() {
            let img = document.querySelector("#qrcode img");
            if(img) {
                let link = document.createElement('a');
                link.download = 'qrcode.png';
                link.href = img.src;
                link.click();
            } else {
                alert("الرجاء إدخال نص أولاً لتوليد الرمز!");
            }
        }
    </script>
</body>
</html>
