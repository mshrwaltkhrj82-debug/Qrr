<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق قارئ ومولد QR</title>
    <!-- استدعاء Tailwind CSS للتصميم -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- مكتبة قراءة وتوليد QR للويب -->
    <script src="https://unpkg.com/@zxing/library@latest"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center p-4">

    <!-- العنوان وزر التبديل بين المسح والتوليد -->
    <div class="w-full max-w-md flex justify-between items-center mb-6 bg-gray-800 p-4 rounded-xl shadow-lg">
        <h1 class="text-xl font-bold text-green-400">قارئ ومولد QR</h1>
        <button onclick="toggleMode()" id="modeToggleBtn" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg text-sm font-semibold transition">
            الانتقال إلى التوليد
        </button>
    </div>

    <!-- قسم المسح وقراءة الرموز (Scan Section) -->
    <div id="scanSection" class="w-full max-w-md flex flex-col items-center bg-gray-800 p-6 rounded-2xl shadow-xl">
        <div class="relative w-full h-64 bg-black rounded-xl overflow-hidden mb-4 flex items-center justify-center border-2 border-green-500">
            <video id="video" class="w-full h-full object-cover"></video>
            <div class="absolute inset-0 border-4 border-dashed border-green-400 opacity-40 pointer-events-none m-8 rounded-lg"></div>
        </div>
        
        <p id="scanResult" class="text-center text-gray-300 bg-gray-700 p-3 rounded-lg w-full mb-3 min-h-[50px] flex items-center justify-center">قم بتوجيه الكاميرا نحو الرمز...</p>
        
        <a id="openUrlBtn" href="#" target="_blank" class="hidden w-full bg-blue-500 hover:bg-blue-600 text-center py-2 rounded-lg font-bold transition mb-3">فتح الرابط</a>
        
        <label class="w-full bg-green-600 hover:bg-green-700 text-center py-3 rounded-xl font-bold cursor-pointer transition shadow-md flex items-center justify-center gap-2">
            <span>📁 رفع صورة تحتوي على QR وقراءتها</span>
            <input type="file" accept="image/*" class="hidden" onchange="scanImageFromFile(event)">
        </label>
    </div>

    <!-- قسم التوليد ورفع الصور لتحويلها لـ QR (Generator Section) -->
    <div id="generatorSection" class="w-full max-w-md flex flex-col items-center bg-gray-800 p-6 rounded-2xl shadow-xl hidden">
        <input type="text" id="textInput" placeholder="أدخل النص أو الرابط هنا..." oninput="generateQR()" class="w-full p-3 bg-gray-700 border border-gray-600 rounded-xl text-white mb-3 focus:outline-none focus:border-green-400 text-right">
        
        <!-- زر جديد لرفع صورة من الجهاز وتحويلها مباشرة إلى QR -->
        <label class="w-full bg-purple-600 hover:bg-purple-700 text-center py-3 rounded-xl font-bold cursor-pointer transition shadow-md flex items-center justify-center gap-2 mb-4">
            <span>📷 رفع صورة لتحويلها إلى QR</span>
            <input type="file" accept="image/*" class="hidden" onchange="uploadAndGenerateQR(event)">
        </label>

        <div class="bg-white p-4 rounded-xl shadow-inner mb-4 flex items-center justify-center min-h-[220px] min-w-[220px]">
            <div id="qrcode"></div>
        </div>

        <p id="statusText" class="text-green-400 text-sm mb-3 font-semibold text-center"></p>
        
        <button onclick="downloadQR()" class="w-full bg-green-600 hover:bg-green-700 py-2 rounded-lg font-bold transition">
            حفظ رمز QR كصورة
        </button>
    </div>

    <!-- مكتبة توليد الـ QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
        let isScanMode = true;
        let codeReader = new ZXing.BrowserQRCodeReader();
        let qrInstance;
        const IMGBB_API_KEY = "d6e15cb5b6c12b8e7157afee611aa441";

        window.onload = function() {
            qrInstance = new QRCode(document.getElementById("qrcode"), {
                text: "",
                width: 200,
                height: 200,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
            startCamera();
        };

        function toggleMode() {
            isScanMode = !isScanMode;
            const scanSec = document.getElementById("scanSection");
            const genSec = document.getElementById("generatorSection");
            const btn = document.getElementById("modeToggleBtn");

            if (isScanMode) {
                scanSec.classList.remove("hidden");
                genSec.classList.add("hidden");
                btn.innerText = "الانتقال إلى التوليد";
                startCamera();
            } else {
                scanSec.classList.add("hidden");
                genSec.classList.remove("hidden");
                btn.innerText = "الانتقال إلى المسح";
                stopCamera();
            }
        }

        function startCamera() {
            codeReader.decodeFromVideoDevice(undefined, 'video', (result, err) => {
                if (result) {
                    processScanResult(result.text);
                }
            }).catch(err => console.error(err));
        }

        function stopCamera() {
            codeReader.reset();
        }

        function processScanResult(text) {
            let resElem = document.getElementById("scanResult");
            let urlBtn = document.getElementById("openUrlBtn");
            
            resElem.innerText = text;
            if (text.startsWith("http://") || text.startsWith("https://")) {
                urlBtn.href = text;
                urlBtn.classList.remove("hidden");
            } else {
                urlBtn.classList.add("hidden");
            }
        }

        function scanImageFromFile(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    codeReader.decodeFromImage(img).then(result => {
                        processScanResult(result.text);
                    }).catch(err => {
                        alert("لم يتم العثور على رمز QR صالح في الصورة المرفوعة!");
                    });
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        // رفع الصورة المتاحة وتحويلها إلى رابط ثم توليد QR لها
        function uploadAndGenerateQR(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById("statusText").innerText = "جاري رفع الصورة وتحويلها لـ QR...";

            const reader = new FileReader();
            reader.onload = function(event) {
                // استخراج Base64 للصورة
                let base64Image = event.target.result.split(',')[1];

                let formData = new FormData();
                formData.append("key", IMGBB_API_KEY);
                formData.append("image", base64Image);

                fetch("https://api.imgbb.com/1/upload", {
                    method: "POST",
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        let imageUrl = data.data.url;
                        document.getElementById("textInput").value = imageUrl;
                        qrInstance.clear();
                        qrInstance.makeCode(imageUrl);
                        document.getElementById("statusText").innerText = "تم رفع الصورة وتوليد الرمز بنجاح!";
                    } else {
                        document.getElementById("statusText").innerText = "فشل رفع الصورة، حاول مجدداً.";
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                    document.getElementById("statusText").innerText = "حدث خطأ أثناء الاتصال بالإنترنت.";
                });
            };
            reader.readAsDataURL(file);
        }

        function generateQR() {
            let val = document.getElementById("textInput").value;
            qrInstance.clear();
            if(val.trim() !== "") {
                qrInstance.makeCode(val);
                document.getElementById("statusText").innerText = "تم إنشاء الرمز بنجاح!";
            } else {
                document.getElementById("statusText").innerText = "";
            }
        }

        function downloadQR() {
            let img = document.querySelector("#qrcode img");
            if(img) {
                let link = document.createElement('a');
                link.download = 'qrcode.png';
                link.href = img.src;
                link.click();
            } else {
                alert("الرجاء إدخال نص أو رفع صورة أولاً لتوليد الرمز!");
            }
        }
    </script>
</body>
</html>
