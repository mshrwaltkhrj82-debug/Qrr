<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>قارئ ومولد QR</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- مكتبة توليد QR الموثوقة لجميع الهواتف -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <!-- مكتبة قراءة QR -->
    <script src="https://unpkg.com/@zxing/library@latest"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center p-4">

    <!-- العنوان وزر التبديل -->
    <div class="w-full max-w-md flex justify-between items-center mb-6 bg-gray-800 p-4 rounded-xl shadow-lg">
        <h1 class="text-xl font-bold text-green-400">قارئ ومولد QR</h1>
        <button onclick="toggleMode()" id="modeToggleBtn" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg text-sm font-semibold transition">
            الانتقال إلى التوليد
        </button>
    </div>

    <!-- ==================== قسم المسح وعرض الصورة المستخرجة ==================== -->
    <div id="scanSection" class="w-full max-w-md flex flex-col items-center bg-gray-800 p-6 rounded-2xl shadow-xl">
        <div class="relative w-full h-64 bg-black rounded-xl overflow-hidden mb-4 flex items-center justify-center border-2 border-green-500">
            <!-- إضافة playsinline و muted لضمان عمل الكاميرا بسلاسة على آيفون -->
            <video id="video" playsinline muted class="w-full h-full object-cover"></video>
            <div class="absolute inset-0 border-4 border-dashed border-green-400 opacity-40 pointer-events-none m-8 rounded-lg"></div>
        </div>

        <!-- صندوق عرض الصورة تلقائياً عند قراءة QR يحتوي على صورة -->
        <div id="scannedImageBox" class="hidden w-full bg-gray-900 p-3 rounded-xl border border-green-500 mb-3 flex flex-col items-center">
            <p class="text-green-400 text-xs font-bold mb-2">تم استخراج الصورة من الرمز:</p>
            <img id="scannedImagePreview" src="" alt="الصورة المستخرجة" class="max-h-64 w-auto rounded-lg object-contain mb-2">
            <a id="openFullImageBtn" href="#" target="_blank" class="w-full bg-green-600 hover:bg-green-700 text-center py-2 rounded-lg text-xs font-bold transition">
                فتح وحفظ الصورة بالحجم الكامل
            </a>
        </div>

        <p id="scanResult" class="text-center text-gray-300 bg-gray-700 p-3 rounded-lg w-full mb-3 min-h-[50px] flex items-center justify-center break-all text-sm">
            قم بتوجيه الكاميرا نحو الرمز...
        </p>

        <a id="openUrlBtn" href="#" target="_blank" class="hidden w-full bg-blue-500 hover:bg-blue-600 text-center py-2.5 rounded-lg font-bold transition mb-3">
            فتح الرابط
        </a>

        <!-- زر فحص صورة QR من الجهاز -->
        <label class="w-full bg-gray-700 hover:bg-gray-600 text-center py-3 rounded-lg font-semibold cursor-pointer transition">
            اختر صورة من الجهاز لفحصها
            <input type="file" accept="image/*" class="hidden" onchange="scanImageFromFile(event)">
        </label>
    </div>

    <!-- ==================== قسم التوليد (نص أو صورة إلى QR) ==================== -->
    <div id="generatorSection" class="w-full max-w-md flex flex-col items-center bg-gray-800 p-6 rounded-2xl shadow-xl hidden">
        
        <!-- إدخال نص أو رابط -->
        <input type="text" id="textInput" placeholder="أدخل النص أو الرابط هنا..." oninput="generateQR(this.value)" class="w-full p-3 bg-gray-700 border border-gray-600 rounded-xl text-white mb-3 focus:outline-none focus:border-green-400 text-right">
        
        <!-- زر رفع صورة لتحويلها إلى QR -->
        <label class="w-full bg-purple-600 hover:bg-purple-700 text-center py-3 rounded-xl font-bold cursor-pointer transition mb-4 shadow flex items-center justify-center gap-2">
            <span>📷 اختر صورة لتحويلها إلى QR</span>
            <input type="file" accept="image/*" class="hidden" onchange="uploadImageToQR(event)">
        </label>

        <!-- المربع الأبيض لعرض رمز الـ QR -->
        <div class="bg-white p-4 rounded-xl shadow-inner mb-3 flex items-center justify-center min-h-[220px] min-w-[220px]">
            <canvas id="qrCanvas" class="w-[200px] h-[200px]"></canvas>
        </div>

        <p id="statusText" class="text-green-400 text-sm mb-3 font-semibold text-center min-h-[20px]"></p>
        
        <button onclick="downloadQR()" class="w-full bg-green-600 hover:bg-green-700 py-3 rounded-lg font-bold transition">
            حفظ رمز QR كصورة
        </button>
    </div>

    <script>
        const IMGBB_API_KEY = "d6e15cb5b6c12b8e7157afee611aa441";
        let isScanMode = true;
        let codeReader = new ZXing.BrowserQRCodeReader();
        let qr;
        let hasGeneratedQR = false;

        window.onload = function() {
            qr = new QRious({
                element: document.getElementById('qrCanvas'),
                size: 500,
                value: '',
                level: 'H'
            });
            clearCanvas();
            startCamera();
        };

        function clearCanvas() {
            const canvas = document.getElementById('qrCanvas');
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            hasGeneratedQR = false;
        }

        // تبديل الأوضاع بين المسح والتوليد
        function toggleMode() {
            isScanMode = !isScanMode;
            const scanSec = document.getElementById("scanSection");
            const genSec = document.getElementById("generatorSection");
            const btn = document.getElementById("modeToggleBtn");

            if (isScanMode) {
                scanSec.classList.remove("hidden");
                genSec.classList.add("hidden");
                btn.innerText = "الانتقال إلى التوليد";
                startCamera();
            } else {
                scanSec.classList.add("hidden");
                genSec.classList.remove("hidden");
                btn.innerText = "الانتقال إلى المسح";
                stopCamera();
            }
        }

        // تشغيل الكاميرا الخلفية للهاتف
        function startCamera() {
            const constraints = { video: { facingMode: "environment" } };
            codeReader.decodeFromConstraints(constraints, 'video', (result, err) => {
                if (result) {
                    handleScannedText(result.text);
                }
            }).catch(() => {
                codeReader.decodeFromVideoDevice(undefined, 'video', (result, err) => {
                    if (result) handleScannedText(result.text);
                });
            });
        }

        function stopCamera() {
            codeReader.reset();
        }

        // معالجة نتيجة المسح وعرض الصورة تلقائياً إذا كان الرمز يحتوي على صورة
        function handleScannedText(text) {
            const resElem = document.getElementById("scanResult");
            const urlBtn = document.getElementById("openUrlBtn");
            const imgBox = document.getElementById("scannedImageBox");
            const imgPreview = document.getElementById("scannedImagePreview");
            const openFullImg = document.getElementById("openFullImageBtn");

            resElem.innerText = text;
            imgBox.classList.add("hidden");

            if (text.startsWith("http://") || text.startsWith("https://")) {
                urlBtn.href = text;
                urlBtn.classList.remove("hidden");

                // التحقق مما إذا كان الرابط صورة وعرضها مباشرة على الشاشة
                imgPreview.onload = function() {
                    imgBox.classList.remove("hidden");
                    openFullImg.href = text;
                };
                imgPreview.onerror = function() {
                    imgBox.classList.add("hidden");
                };
                imgPreview.src = text;
            } else {
                urlBtn.classList.add("hidden");
            }
        }

        // قراءة رمز QR من صورة محفوظة في الهاتف
        function scanImageFromFile(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    codeReader.decodeFromImage(img).then(result => {
                        handleScannedText(result.text);
                    }).catch(() => {
                        alert("لم يتم العثور على رمز QR صالح في الصورة!");
                    });
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        // توليد رمز QR من نص أو رابط
        function generateQR(val) {
            const status = document.getElementById("statusText");
            if (!val || val.trim() === "") {
                clearCanvas();
                status.innerText = "";
                return;
            }
            qr.value = val.trim();
            hasGeneratedQR = true;
            status.className = "text-green-400 text-sm mb-3 font-semibold text-center";
            status.innerText = "تم إنشاء الرمز بنجاح!";
        }

        // ضغط الصورة قبل رفعها لضمان سرعة التحويل وعدم الفشل
        function compressImage(file, maxSize = 800, quality = 0.75) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        let w = img.width, h = img.height;
                        if (w > maxSize || h > maxSize) {
                            if (w > h) { h = Math.round((h * maxSize) / w); w = maxSize; }
                            else { w = Math.round((w * maxSize) / h); h = maxSize; }
                        }
                        const canvas = document.createElement("canvas");
                        canvas.width = w;
                        canvas.height = h;
                        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL("image/jpeg", quality));
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // رفع الصورة المختارة وتحويلها إلى رمز QR
        async function uploadImageToQR(e) {
            const file = e.target.files[0];
            if (!file) return;

            const status = document.getElementById("statusText");
            status.className = "text-yellow-400 text-sm mb-3 font-semibold text-center animate-pulse";
            status.innerText = "جاري رفع الصورة وتحويلها إلى QR...";

            try {
                const compressedDataUrl = await compressImage(file, 800, 0.75);
                const base64Image = compressedDataUrl.split(',')[1];

                const formData = new FormData();
                formData.append("key", IMGBB_API_KEY);
                formData.append("image", base64Image);

                const response = await fetch("https://api.imgbb.com/1/upload", {
                    method: "POST",
                    body: formData
                });

                const result = await response.json();

                if (result && result.success && result.data && result.data.url) {
                    const directImageUrl = result.data.url;
                    document.getElementById("textInput").value = directImageUrl;
                    generateQR(directImageUrl);
                    status.className = "text-green-400 text-sm mb-3 font-semibold text-center";
                    status.innerText = "تم تحويل الصورة إلى QR بنجاح!";
                } else {
                    throw new Error("Upload error");
                }
            } catch (err) {
                status.className = "text-red-400 text-sm mb-3 font-semibold text-center";
                status.innerText = "فشل رفع الصورة، تأكد من الاتصال بالإنترنت.";
            }
        }

        // حفظ الرمز كصورة في الهاتف
        function downloadQR() {
            if (!hasGeneratedQR) {
                alert("الرجاء إدخال نص أو اختيار صورة أولاً لتوليد الرمز!");
                return;
            }
            const canvas = document.getElementById("qrCanvas");
            const link = document.createElement("a");
            link.download = "qrcode.png";
            link.href = canvas.toDataURL("image/png");
            link.click();
        }
    </script>
</body>
</html>
