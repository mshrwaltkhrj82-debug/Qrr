<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحويل الصور والنصوص إلى QR</title>
    <!-- استدعاء Tailwind CSS للتصميم المتجاوب -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- مكتبة QRious المضمونة لتوليد QR على Canvas مباشرة -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <!-- مكتبة ZXing لمسح رموز QR بالكاميرا -->
    <script src="https://unpkg.com/@zxing/library@latest"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center p-4 font-sans">

    <!-- شريط التنقل العلوي -->
    <div class="w-full max-w-md bg-slate-800 p-2 rounded-2xl shadow-lg mb-6 flex gap-2 border border-slate-700">
        <button onclick="switchTab('generate')" id="tabGenerate" class="flex-1 py-2.5 rounded-xl font-bold text-sm transition bg-emerald-600 text-white shadow">
            🖼️ إنشاء QR (صورة / نص)
        </button>
        <button onclick="switchTab('scan')" id="tabScan" class="flex-1 py-2.5 rounded-xl font-bold text-sm transition text-slate-300 hover:bg-slate-700">
            📷 مسح وقراءة QR
        </button>
    </div>

    <!-- ==================== 1. قسم توليد QR من صورة أو نص ==================== -->
    <div id="generatorSection" class="w-full max-w-md bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 flex flex-col items-center">
        
        <!-- زر رفع الصورة لتحويلها إلى QR -->
        <label class="w-full bg-gradient-to-l from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 text-white py-4 px-4 rounded-xl font-bold cursor-pointer transition shadow-lg flex flex-col items-center justify-center gap-2 mb-4 border border-purple-400/30">
            <span class="text-lg">📤 اضغط هنا لرفع صورة وتحويلها إلى QR</span>
            <span class="text-xs text-purple-200 font-normal">يتم ضغط الصورة ورفعها تلقائياً لتوليد الرمز</span>
            <input type="file" id="imageUploadInput" accept="image/*" class="hidden" onchange="handleImageToQR(event)">
        </label>

        <!-- معاينة الصورة المرفوعة -->
        <div id="imagePreviewContainer" class="hidden w-full mb-4 bg-slate-900/60 p-3 rounded-xl border border-slate-700 flex items-center gap-3">
            <img id="uploadedImagePreview" src="" alt="معاينة" class="w-16 h-16 object-cover rounded-lg border border-slate-600">
            <div class="flex-1 overflow-hidden">
                <p class="text-xs text-emerald-400 font-bold mb-1">تم تجهيز الصورة بنجاح:</p>
                <a id="uploadedImageUrl" href="#" target="_blank" class="text-xs text-blue-400 underline truncate block dir-ltr text-left"></a>
            </div>
        </div>

        <div class="w-full flex items-center gap-2 my-2">
            <hr class="flex-1 border-slate-700">
            <span class="text-xs text-slate-400">أو اكتب نصاً / رابطاً</span>
            <hr class="flex-1 border-slate-700">
        </div>

        <!-- حقل إدخال النص أو الرابط -->
        <input type="text" id="textInput" placeholder="أدخل النص أو الرابط هنا..." oninput="generateQRFromText(this.value)" class="w-full p-3.5 bg-slate-900 border border-slate-600 rounded-xl text-white mt-2 mb-4 focus:outline-none focus:border-emerald-400 text-right">

        <!-- حالة العملية -->
        <p id="statusText" class="text-amber-400 text-sm mb-4 font-bold text-center min-h-[20px]"></p>

        <!-- منطقة عرض رمز الـ QR -->
        <div class="bg-white p-4 rounded-2xl shadow-inner mb-5 flex items-center justify-center">
            <canvas id="qrCanvas" class="w-[220px] h-[220px]"></canvas>
        </div>

        <!-- زر تحميل الرمز -->
        <button onclick="downloadQR()" class="w-full bg-emerald-600 hover:bg-emerald-700 py-3.5 rounded-xl font-bold transition shadow-md flex items-center justify-center gap-2">
            <span>💾 حفظ رمز QR كصورة</span>
        </button>
    </div>

    <!-- ==================== 2. قسم مسح QR بالكاميرا أو من صورة ==================== -->
    <div id="scanSection" class="w-full max-w-md bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 flex flex-col items-center hidden">
        <div class="relative w-full h-64 bg-black rounded-xl overflow-hidden mb-4 flex items-center justify-center border-2 border-emerald-500">
            <video id="video" class="w-full h-full object-cover"></video>
            <div class="absolute inset-0 border-2 border-dashed border-emerald-400 opacity-50 pointer-events-none m-8 rounded-lg"></div>
        </div>

        <p id="scanResult" class="text-center text-slate-200 bg-slate-900 p-3.5 rounded-xl w-full mb-3 min-h-[54px] flex items-center justify-center break-all">
            قم بتوجيه الكاميرا نحو الرمز...
        </p>

        <a id="openUrlBtn" href="#" target="_blank" class="hidden w-full bg-blue-600 hover:bg-blue-700 text-center py-3 rounded-xl font-bold transition mb-3 shadow">
            🌐 فتح الرابط المكتشف
        </a>

        <label class="w-full bg-slate-700 hover:bg-slate-600 text-center py-3 rounded-xl font-semibold cursor-pointer transition flex items-center justify-center gap-2">
            <span>🔍 قراءة رمز QR من صورة محفوظة</span>
            <input type="file" accept="image/*" class="hidden" onchange="scanQRFromFile(event)">
        </label>
    </div>

    <script>
        const IMGBB_API_KEY = "d6e15cb5b6c12b8e7157afee611aa441";
        let qr;
        let codeReader = new ZXing.BrowserQRCodeReader();
        let hasValidQR = false;

        // تهيئة لوحة الـ QR عند فتح الصفحة
        window.onload = function() {
            qr = new QRious({
                element: document.getElementById('qrCanvas'),
                size: 512,
                value: 'https://google.com',
                level: 'H'
            });
            clearQRCanvas();
        };

        // تنظيف اللوحة قبل التوليد
        function clearQRCanvas() {
            const canvas = document.getElementById('qrCanvas');
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#94a3b8";
            ctx.font = "bold 28px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("سيظهر رمز QR هنا", canvas.width / 2, canvas.height / 2);
            hasValidQR = false;
        }

        // التبديل بين تبويب التوليد وتبويب المسح
        function switchTab(tab) {
            const genSec = document.getElementById("generatorSection");
            const scanSec = document.getElementById("scanSection");
            const tabGen = document.getElementById("tabGenerate");
            const tabScan = document.getElementById("tabScan");

            if (tab === 'generate') {
                genSec.classList.remove("hidden");
                scanSec.classList.add("hidden");
                tabGen.className = "flex-1 py-2.5 rounded-xl font-bold text-sm transition bg-emerald-600 text-white shadow";
                tabScan.className = "flex-1 py-2.5 rounded-xl font-bold text-sm transition text-slate-300 hover:bg-slate-700";
                stopCamera();
            } else {
                genSec.classList.add("hidden");
                scanSec.classList.remove("hidden");
                tabScan.className = "flex-1 py-2.5 rounded-xl font-bold text-sm transition bg-emerald-600 text-white shadow";
                tabGen.className = "flex-1 py-2.5 rounded-xl font-bold text-sm transition text-slate-300 hover:bg-slate-700";
                startCamera();
            }
        }

        // توليد QR من النص أو الرابط مباشرة
        function generateQRFromText(text) {
            const status = document.getElementById("statusText");
            if (!text || text.trim() === "") {
                clearQRCanvas();
                status.innerText = "";
                return;
            }
            qr.value = text.trim();
            hasValidQR = true;
            status.className = "text-emerald-400 text-sm mb-4 font-bold text-center";
            status.innerText = "✅ تم توليد رمز الـ QR بنجاح!";
        }

        // ضغط الصورة في المتصفح لمنع خطأ السيرفر 503 وتسريع الرفع
        function compressImage(file, maxSize = 800, quality = 0.75) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        let width = img.width;
                        let height = img.height;

                        if (width > maxSize || height > maxSize) {
                            if (width > height) {
                                height = Math.round((height * maxSize) / width);
                                width = maxSize;
                            } else {
                                width = Math.round((width * maxSize) / height);
                                height = maxSize;
                            }
                        }

                        const canvas = document.createElement("canvas");
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext("2d");
                        ctx.drawImage(img, 0, 0, width, height);

                        const dataUrl = canvas.toDataURL("image/jpeg", quality);
                        resolve(dataUrl);
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // معالجة رفع الصورة وتحويلها إلى QR
        async function handleImageToQR(event) {
            const file = event.target.files[0];
            if (!file) return;

            const status = document.getElementById("statusText");
            const previewContainer = document.getElementById("imagePreviewContainer");
            const previewImg = document.getElementById("uploadedImagePreview");
            const previewUrl = document.getElementById("uploadedImageUrl");

            status.className = "text-amber-400 text-sm mb-4 font-bold text-center animate-pulse";
            status.innerText = "⏳ جاري ضغط الصورة ورفعها لتوليد الـ QR...";

            try {
                // 1. ضغط الصورة
                const compressedDataUrl = await compressImage(file, 800, 0.75);
                previewImg.src = compressedDataUrl;
                const base64String = compressedDataUrl.split(',')[1];

                // 2. رفع الصورة إلى ImgBB
                const formData = new FormData();
                formData.append("key", IMGBB_API_KEY);
                formData.append("image", base64String);

                const response = await fetch("https://api.imgbb.com/1/upload", {
                    method: "POST",
                    body: formData
                });

                const result = await response.json();

                if (result && result.success && result.data && result.data.url) {
                    const imageUrl = result.data.url;

                    // وضع الرابط في الحقل وتوليد الـ QR
                    document.getElementById("textInput").value = imageUrl;
                    previewUrl.href = imageUrl;
                    previewUrl.innerText = imageUrl;
                    previewContainer.classList.remove("hidden");

                    generateQRFromText(imageUrl);
                    status.className = "text-emerald-400 text-sm mb-4 font-bold text-center";
                    status.innerText = "✅ تم تحويل الصورة إلى رمز QR بنجاح!";
                } else {
                    throw new Error("فشل استخراج الرابط من السيرفر");
                }
            } catch (err) {
                console.error(err);
                status.className = "text-red-400 text-sm mb-4 font-bold text-center";
                status.innerText = "❌ تعذر رفع الصورة، تأكد من اتصالك بالإنترنت وحاول مجدداً.";
            }
        }

        // حفظ وتنزيل رمز الـ QR كصورة PNG
        function downloadQR() {
            if (!hasValidQR) {
                alert("الرجاء رفع صورة أو كتابة نص أولاً لتوليد رمز QR!");
                return;
            }
            const canvas = document.getElementById('qrCanvas');
            const link = document.createElement('a');
            link.download = 'QR_' + Date.now() + '.png';
            link.href = canvas.toDataURL("image/png");
            link.click();
        }

        // ==================== دوال الكاميرا والمسح ====================
        function startCamera() {
            codeReader.decodeFromVideoDevice(undefined, 'video', (result, err) => {
                if (result) {
                    showScanResult(result.text);
                }
            }).catch(err => console.error(err));
        }

        function stopCamera() {
            codeReader.reset();
        }

        function showScanResult(text) {
            const resElem = document.getElementById("scanResult");
            const urlBtn = document.getElementById("openUrlBtn");
            resElem.innerText = text;

            if (text.startsWith("http://") || text.startsWith("https://")) {
                urlBtn.href = text;
                urlBtn.classList.remove("hidden");
            } else {
                urlBtn.classList.add("hidden");
            }
        }

        function scanQRFromFile(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    codeReader.decodeFromImage(img).then(result => {
                        showScanResult(result.text);
                    }).catch(() => {
                        alert("لم يتم العثور على رمز QR بداخل هذه الصورة!");
                    });
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
